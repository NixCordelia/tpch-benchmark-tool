# 双库对比配置示例。复制为 config.compare.yaml 后填写两边 password。
# 跑之前先看 results/README.md：results.csv / report.md 会被覆盖；pg_multirun_* 不会。
#
# 实测：rounds=1，concurrency=1，timeout=300。
# PostgreSQL：21 成功，Q21 TIMEOUT；YMatrix：22 成功。
# target 的 session_params 不要设 jit（Greenplum/MatrixDB 可能没有该 GUC）。

database:
  host: localhost
  port: 5432
  user: tpch
  password: "YOUR_PASSWORD"
  database: tpch
  session_params:
    work_mem: "256MB"
    jit: "off"

test:
  sql_dir: ./sql
  rounds: 1
  concurrency: 1
  warmup: false
  timeout: 300

compare:
  enabled: true
  target:
    host: localhost
    port: 5433
    user: YOUR_TARGET_USER
    password: "YOUR_PASSWORD"
    database: tpch
    session_params:
      work_mem: "256MB"
